[package]
name = "vaunt-window"
version = "0.1.0"
description = "The desktop window `npx vaunt start` opens the studio in"
edition = "2021"
publish = false

[[bin]]
name = "vaunt-window"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
